[package]
name = "banquo-parser"
version = "0.2.0"
edition = "2021"
authors = ["Quinn Thibeault <qthibeau@asu.edu>"]
description = "Formula parsing functionality for Banquo monitor"
documentation = "https://docs.rs/banquo"
repository = "https://github.com/cpslab-asu/banquo"
license = "BSD-3-Clause"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
banquo-core = { path = "../banquo-core", version = "0.1.0" }
banquo-hybrid_distance = { path = "../banquo-hybrid_distance", version = "0.1.0" }
chumsky = "0.13.0"
thiserror = "2.0.18"

[dev-dependencies]
banquo = { path = "../banquo" }
